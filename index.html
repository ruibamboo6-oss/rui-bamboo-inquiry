<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Rui Bamboo Inquiry</title>
</head>

<body>

    <div class="container">
    <h1>Rui Bamboo | 瑞竹</h1>
    <p>Welcome to Rui Bamboo.</p>

    <h2>Bamboo Fiber Tableware Manufacture</h2>

    <p>We supply bamboo fiber tableware for importers, distributors and wholesale buyers.</p>

    <h3>Product Inquiry</h3>

    <label>Company Name</label>
    <br>
    <input type="text">
    <br><br>

    <label>Email</label>
    <br>
    <input type="email">
    <br><br>

    <label>Product</label>
    <br>
    <select>
        <option>Bamboo Fiber Bowl</option>
        <option>Bamboo Fiber Plate</option>
        <option>Bamboo Fiber Food Container</option>
        <option>Other</option>
    </select>
    <br><br>

    <label>Message</label>
    <br>
    <textarea rows="5" cols="40"></textarea>
    <br><br>

    <button>Send Inquiry</button>
    </div>
</body>
</html>
