<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Rui Bamboo Inquiry</title>
</head>
 
<body>

    <div class="container">
   <header class="header">
    <div class="logo">RUI BAMBOO</div>

    <nav>
        <a href="#products">Products</a>
        <a href="#inquiry">Contact Us</a>
    </nav>
</header>
    <p>Welcome to Rui Bamboo.</p>

   <section class="hero" id="products">

    <div class="hero-text">

        <h1>Bamboo Fiber Tableware</h1>

        <h2>For Global Wholesale Buyers</h2>

        <p>
            Replace Plastic Tableware With Bamboo Fiber Solutions.
        </p>

        <a class="button" href="#inquiry">Get a Quote</a>

    </div>

    <div class="hero-image">
        <img src="bamboo-bowl.jpg" alt="Rui Bamboo Bamboo Fiber Bowl">
    </div>

</section>

    <h3>Product Inquiry</h3>

    <label>Company Name</label>
    <br>
   <input type="text" id="name" placeholder="Your Company Name">
    <br><br>

    <label>Email</label>
    <br>
    <input type="email">
    <br><br>

    <label>Product</label>
    <br>
    <select>
        <option>Bamboo Fiber Bowl</option>
        <option>Bamboo Fiber Plate</option>
        <option>Bamboo Fiber Food Container</option>
        <option>Other</option>
    </select>
    <br><br>

    <label>Message</label>
    <br>
    <textarea rows="5" cols="40"></textarea>
    <br><br>

<button onclick="sendInquiry()">Send Inquiry</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
